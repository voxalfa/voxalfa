[dependencies]
fontdb = { version = "0.23", default-features = false, features = ["std"] }
krilla = "0.8.2"
krilla-svg = "0.8.1"
thiserror = { workspace = true }
usvg = "0.47"
voxalfa-core = { workspace = true }
voxalfa-svg = { workspace = true }
