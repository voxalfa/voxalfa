[package]
name = "voxalfa-cli"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "A command line interface for the core voxalfa functions."

[[bin]]
name = "voxalfa"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
codespan-reporting = "0.13.1"
glob = "0.3.4"
similar = { version = "3.1.1", features = ["inline"] }
thiserror = { workspace = true }
voxalfa-build-info = { workspace = true }
voxalfa-formatter = { workspace = true }
voxalfa-midi = { workspace = true }
voxalfa-core = { workspace = true }
voxalfa-pdf = { workspace = true }
voxalfa-svg = { workspace = true }
