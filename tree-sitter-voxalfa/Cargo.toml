[package]
name = "tree-sitter-voxalfa"
description = "Voxalfa tree-sitter parser"
version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
keywords = ["incremental", "parsing", "tree-sitter", "voxalfa"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = { workspace = true }
edition = { workspace = true }
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"
doctest = false

[dependencies]
tree-sitter-language = "0.1.9"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.1"

[lints.clippy]
const_is_empty = "allow"
