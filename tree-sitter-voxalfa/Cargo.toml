[package]
name = "tree-sitter-voxalfa"
description = "Voxalfa tree-sitter parser"
version = "0.1.0"
authors = ["LIOKA Ranarison Fiderana <luckasranarison@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "voxalfa"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/voxalfa/voxalfa"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.8"
