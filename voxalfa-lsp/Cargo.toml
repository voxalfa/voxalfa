[package]
name = "voxalfa-lsp"
description = "The official Voxalfa language server implementation"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lib]
name = "voxalfa_lsp"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
path = "src/main.rs"
name = "voxalfa-ls"

[dependencies]
# wasm + native shared
async-lsp = { version = "0.2.4", default-features = false, features = ["omni-trait", "tracing"] }
futures = "0.3.33"
ropey = "1.6.1"
serde_json = "1"
tower = "0.5.3"
tracing = "0.1.44"
tree-sitter = "0.27.1"
voxalfa-build-info = { workspace = true }
voxalfa-core = { workspace = true }
voxalfa-formatter = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-lsp = { version = "0.2.4", features = ["tokio"] }
clap = { workspace = true }
tokio = { version = "1.53.1", features = ["macros", "rt", "io-std"] }
tokio-util = { version = "0.7.19", features = ["compat", "futures-io"] }
tracing-subscriber = "0.3.23"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
piper = "0.2.5"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.107", features = ["console"] }
