[package]
name = "voxalfa-lsp"
description = "The official Voxalfa language server implementation"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[[bin]]
path = "src/main.rs"
name = "voxalfa-ls"

[dependencies]
async-lsp = { version = "0.2.4", features = ["tokio"] }
clap = { workspace = true }
futures = "0.3.33"
ropey = "1.6.1"
tokio = { version = "1.53.1", features = ["macros", "rt", "io-std"] }
tokio-util = { version = "0.7.19", features = ["compat","futures-io"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
voxalfa-build-info = { workspace = true }
voxalfa-core = { workspace = true }
voxalfa-formatter = { workspace = true }
tree-sitter = "0.27.1"
