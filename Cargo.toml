[workspace]
resolver = "3"
members = [
  "voxalfa-core",
  "voxalfa-formatter",
  "voxalfa-midi",
  "voxalfa-cli",
  "tree-sitter-voxalfa", "voxalfa-lsp",
]

[workspace.dependencies]
insta = "1.48.0"
thiserror = "2.0.18"
tree-sitter-voxalfa = { path = "./tree-sitter-voxalfa" }
voxalfa-midi = { path = "./voxalfa-midi" }
voxalfa-formatter = { path = "./voxalfa-formatter" }
voxalfa-core = { path = "./voxalfa-core" }
