name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-rust-workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint workspace
        run: cargo clippy -- -D warnings

      - name: Run all workspace tests
        run: cargo test --workspace

  test-parser:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tree-sitter-voxalfa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm install

      - name: Generate parser
        run: npx tree-sitter generate

      - name: Run tests
        run: npm test
