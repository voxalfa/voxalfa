name: Nightly Release

on:
  schedule:
    - cron: "0 0 * * *" # Midnight UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.binary.name }} - ${{ matrix.platform.os }} (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_suffix: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_suffix: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_suffix: windows-x86_64
        binary:
          - package: voxalfa-cli
            name: voxalfa
          - package: voxalfa-lsp
            name: voxalfa-ls

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.platform.target }} -p ${{ matrix.binary.package }}

      - name: Rename binary for release
        shell: bash
        run: |
          mkdir dist
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          cp "target/${{ matrix.platform.target }}/release/${{ matrix.binary.name }}${ext}" \
             "dist/${{ matrix.binary.name }}-${{ matrix.platform.asset_suffix }}${ext}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.binary.name }}-${{ matrix.platform.asset_suffix }}
          path: dist/*
          retention-days: 1

  publish-nightly:
    name: Publish Nightly Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Release"
          body: "Automated nightly build from commit ${{ github.sha }}."
          prerelease: true
          files: |
            voxalfa-*
