name: Nightly Release

on:
  schedule:
    - cron: "0 0 * * *" # Midnight UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.platform.os }} (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: voxalfa-linux-x86_64
            exe_ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: voxalfa-macos-x86_64
            exe_ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: voxalfa-macos-arm64
            exe_ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: voxalfa-windows-x86_64
            exe_ext: ".exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build binaries
        run: cargo build --release --target ${{ matrix.platform.target }} -p voxalfa-cli -p voxalfa-ls

      - name: Package binaries into tarball
        shell: bash
        run: |
          mkdir -p staging dist
          cp "target/${{ matrix.platform.target }}/release/voxalfa${{ matrix.platform.exe_ext }}" staging/
          cp "target/${{ matrix.platform.target }}/release/voxalfa-ls${{ matrix.platform.exe_ext }}" staging/
          tar -czvf "dist/${{ matrix.platform.asset_name }}.tar.gz" -C staging .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.platform.asset_name }}
          path: dist/*.tar.gz
          retention-days: 1

  publish-nightly:
    name: Publish Nightly Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Release"
          body: "Automated nightly build from commit ${{ github.sha }}."
          prerelease: true
          files: |
            *.tar.gz