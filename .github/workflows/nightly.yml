name: Nightly Release

on:
  schedule:
    - cron: "0 0 * * *" # Midnight UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.platform.os }} (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: voxalfa
            asset_name: voxalfa-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: voxalfa
            asset_name: voxalfa-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: voxalfa
            asset_name: voxalfa-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: voxalfa.exe
            asset_name: voxalfa-windows-x86_64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build binary
        run: cargo build --release --target ${{ matrix.platform.target }} -p voxalfa-cli

      - name: Rename binary for release
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin_name }}" "dist/${{ matrix.platform.asset_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform.asset_name }}
          path: dist/*
          retention-days: 1

  publish-nightly:
    name: Publish Nightly Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Release"
          body: "Automated nightly build from commit ${{ github.sha }}."
          prerelease: true
          files: |
            voxalfa-*
